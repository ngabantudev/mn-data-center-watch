# .github/workflows/refresh-news.yml
#
# Keeps the news feed fresh by triggering a full rebuild + redeploy on a
# schedule, instead of fetching Google News on every visitor's request.
# Each rebuild re-runs fetchLocalNews() at build time, same as any other
# deploy — nothing in the app code changes for this to work.
#
# CADENCE: MN data center coverage is genuinely active right now (moratorium
# votes, zoning fights, utility agreements across multiple outlets most
# weeks), so hourly is overkill but daily can miss same-day news. Defaulting
# to every 6 hours below — loosen or tighten the cron expression as you get
# a feel for how often new articles actually show up in the feed.
#
# SETUP (Cloudflare Pages / Workers Builds):
#   1. Go to Workers & Pages -> your project -> Settings -> Builds ->
#      Deploy Hooks -> Add deploy hook. Name it (e.g. "scheduled-news-refresh"),
#      pick the branch you deploy from, and copy the generated URL.
#   2. In your GitHub repo: Settings -> Secrets and variables -> Actions
#      -> New repository secret -> name it DEPLOY_HOOK_URL, paste the URL.

name: Refresh news feed

on:
  schedule:
    # Every 6 hours (UTC): 00:00, 06:00, 12:00, 18:00.
    # Examples: "0 */4 * * *" = every 4 hours, "0 8,20 * * *" = twice daily.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a manual rebuild from the Actions tab

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare deploy hook
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

# --- Alternative: trigger the rebuild entirely within Cloudflare ---
# Cloudflare Deploy Hooks can also be called from a Cloudflare Worker with
# its own Cron Trigger, which keeps everything in one platform instead of
# depending on GitHub Actions. That Worker is just:
#
#   export default {
#     async scheduled(event, env, ctx) {
#       ctx.waitUntil(fetch(env.DEPLOY_HOOK_URL, { method: "POST" }));
#     },
#   };
#
# with a `[triggers] crons = ["0 */6 * * *"]` entry in that Worker's
# wrangler.toml, and DEPLOY_HOOK_URL set as a Worker secret. Functionally
# equivalent to the GitHub Actions job above — pick whichever you'd rather
# maintain.