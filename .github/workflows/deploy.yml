# .github/workflows/deploy.yml
#
# Deploys `main` to production on every push.
#
# WHY THIS EXISTS: merging a PR used to change nothing about the live site.
# Workers Builds was never connected to this repo, and pr-preview.yml only calls
# `wrangler versions upload`, which deliberately never takes production traffic.
# So `main` and production drifted — at the point this was written, production
# was serving a build from over a day earlier, still carrying the automatic
# geolocation prompt that had already been removed on `main`.
#
# That's the failure mode worth designing against: not a broken deploy, but a
# fix that everyone believes shipped and didn't. A privacy change sitting
# unreleased for a week is exactly the shape of that bug.
#
# This is the only workflow that touches production traffic. pr-preview.yml
# stays upload-only, so previews still can't affect the live site.

name: Deploy to production

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit —
  # useful if a deploy failed on a transient upload error.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # The public hostname, attached to this Worker as a Cloudflare custom domain.
  # This is what the deploy gate checks, and the distinction matters: the
  # workers.dev host answers even when the custom domain is broken, so a gate
  # that only tested workers.dev would stay green while the URL people actually
  # visit was down. That is the one fail-open-on-a-gate combination this repo
  # otherwise avoids.
  CANONICAL: https://mndatacenter.org
  # Kept as a second check rather than dropped: `workers_dev: true` is pinned in
  # wrangler.jsonc precisely so this host survives, and refresh-news.yml still
  # curls it. If it ever stops answering, that should fail here rather than in
  # a news refresh at 3am.
  FALLBACK_HOST: https://mn-data-center-watch.resistance.workers.dev
  # One archive, to catch the silent failure in the map path: if the tile host
  # stops serving, overlays simply do not draw and — with observability off by
  # design — nothing else would report it.
  TILE_ARCHIVE: https://tiles.mndatacenter.org/convertedCity_Boundaries_in_Minnesota.pmtiles

# Deploys queue, they do not cancel. `cancel-in-progress: true` would be wrong
# here: killing a run mid-deploy risks an older push winning the race and
# quietly reverting production to a previous commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the `engines.node` floor in package.json.
          node-version: "22.12"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # No OPENSTATES_API_KEY here on purpose. Bills and news are both fetched
        # per request at runtime, never baked in at build time, so the build has
        # no need for the key — and production reads it from the Worker secret.
        run: npm run build

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail

          # Fail with the actual problem rather than a wrangler auth error that
          # reads like broken config.
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ]  && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          npx wrangler deploy 2>&1 | tee deploy.log

          # Same lesson as pr-preview.yml: a Workers host is
          # <name>.<subdomain>.workers.dev, so the character class has to allow
          # dots. Without one, this matches nothing and the smoke test below
          # silently checks an empty URL.
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          VERSION=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' deploy.log | head -1)

          if [ -z "$URL" ]; then
            echo "::warning::No URL in wrangler output; falling back to the known production host."
            URL="https://mn-data-center-watch.resistance.workers.dev"
          fi

          echo "url=$URL"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify production
        run: |
          # A deploy that reports success while the site 500s is the worst
          # outcome, so check the page and both live routes and fail the run if
          # any of them is unhappy. This is the gate that makes a red tick in the
          # Actions tab mean "production is broken" rather than "a script ended".
          fail=0

          check() {
            name="$1"; url="$2"; expect="${3:-200}"
            code=$(curl -s -o body.json -w '%{http_code}' --max-time 60 "$url")
            printf '  %-34s %s\n' "$name" "$code"
            [ "$code" = "$expect" ] || { echo "::error::$name returned $code (wanted $expect)"; fail=1; }
          }

          echo "Canonical host — $CANONICAL"
          check "/"                    "$CANONICAL/"
          check "/api/legislation"     "$CANONICAL/api/legislation"
          check "/api/news?days=7"     "$CANONICAL/api/news?days=7"

          echo "Fallback host — $FALLBACK_HOST"
          check "/ (workers.dev)"      "$FALLBACK_HOST/"

          # A plain GET would pull 200 KB on every deploy. The archives are
          # range-request format and the client only ever asks for slices, so
          # ask for one the same way MapLibre would: 206 proves the host serves
          # AND that Range still works, which is the part PMTiles cannot do
          # without. A 200 here would mean Range was ignored — broken for the
          # map even though the file is reachable.
          echo "Tile archive"
          tile=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
                   -H 'Range: bytes=0-127' "$TILE_ARCHIVE")
          printf '  %-34s %s\n' "Range bytes=0-127" "$tile"
          [ "$tile" = "206" ] || { echo "::error::Tile archive returned $tile (wanted 206)"; fail=1; }

          exit $fail

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          {
            echo "### Production deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| URL | $CANONICAL |"
            echo "| Worker host | $URL |"
            echo "| Version | \`${VERSION:-unknown}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
